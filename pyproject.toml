[project]
name = "easy-nfse"
version = "0.2.3"
description = "Emite NFS-e do padrão nacional a partir de uma nota anterior"
authors = [
    { name = "Lucas Borges", email = "lucas@lukasborges.me" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
easy-nfse = "easy_nfse:main"

[project.gui-scripts]
easy-nfse-desktop = "easy_nfse.desktop:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
desktop = [
    "pywebview>=6.2.1",
]
dev = [
    "pytest>=9.1.1",
    "xmlsec>=1.3.17",
]

[tool.pytest.ini_options]
# Com PYTHONWARNDEFAULTENCODING=1 (definido na CI), abrir arquivo de texto sem `encoding` no código do app
# vira erro: no Windows o padrão é cp1252, não UTF-8.
filterwarnings = ["error::EncodingWarning:easy_nfse"]
