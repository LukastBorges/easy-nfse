{# Importação de nota anterior (PDF/XML ou chave de acesso). Precisa de: cert #}
<form class="mt-6" hx-post="/importar" hx-encoding="multipart/form-data" hx-target="#import-feedback"
      hx-disabled-elt="find input">
  <label data-dropzone
         class="group relative flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-6 py-12 text-center transition hover:border-indigo-400 hover:bg-indigo-50/40 dark:hover:bg-indigo-500/5 data-[over]:border-indigo-500 data-[over]:bg-indigo-50 dark:data-[over]:bg-indigo-500/10">
    <input type="file" name="arquivo" accept=".pdf,.xml,application/pdf,text/xml,application/xml" class="sr-only">
    <span class="htmx-hide-on-request grid size-12 place-items-center rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 ring-1 ring-indigo-100 dark:ring-indigo-500/20 transition group-hover:scale-105">
      <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </span>
    <span class="htmx-indicator size-12 items-center justify-center">
      <svg class="size-7 animate-spin text-indigo-600 dark:text-indigo-400" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity=".2" stroke-width="3"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    </span>
    <span class="mt-4 text-sm font-semibold text-slate-900 dark:text-slate-100">Arraste o PDF ou o XML da nota aqui</span>
    <span class="mt-1 text-sm text-slate-500 dark:text-slate-400">ou <span class="font-medium text-indigo-600 dark:text-indigo-400 underline-offset-2 group-hover:underline">escolha um arquivo</span>. DANFSe, impressão do Emissor Nacional ou XML.</span>
  </label>
</form>
<div id="import-feedback" class="mt-4"></div>

{% if cert and cert.ok %}
<form class="mt-4 flex gap-2" hx-post="/importar/chave" hx-target="#import-feedback" hx-disabled-elt="find button">
  <input name="chave" class="input font-mono text-xs" placeholder="…ou cole a chave de acesso (50 dígitos)" inputmode="numeric" required>
  <button class="btn-ghost shrink-0">Importar</button>
</form>
{% endif %}
