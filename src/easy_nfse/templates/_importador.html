{# Importação de nota anterior (PDF/XML ou chave de acesso), como uma bandeja onde a nota é solta. Precisa de: certs #}
<form hx-post="/importar" hx-encoding="multipart/form-data" hx-target="#import-feedback" hx-disabled-elt="find input">
  <label data-dropzone
         class="group relative grid cursor-pointer items-center gap-6 rounded-[18px] border-[1.5px] border-dashed border-mostarda/40 bg-[linear-gradient(165deg,rgba(213,161,26,.08),rgba(213,161,26,.02))] p-6 transition-colors duration-300 hover:border-mostarda/70 data-[over]:border-mostarda data-[over]:bg-mostarda/15 sm:grid-cols-[auto_minmax(0,1fr)_auto] sm:p-7">
    <input type="file" name="arquivo" accept=".pdf,.xml,application/pdf,text/xml,application/xml" class="sr-only">
    {# a nota anterior: uma folha que se ergue no hover e ao arrastar #}
    <span class="relative hidden h-[104px] w-[92px] sm:block" aria-hidden="true">
      <span class="papel absolute top-2.5 left-1.5 h-[90px] w-[70px] -rotate-[8deg] opacity-55"></span>
      <span class="papel absolute top-1 left-[18px] h-[90px] w-[70px] rotate-[4deg] transition-transform duration-500 ease-mesa group-hover:-translate-y-1 group-hover:rotate-1 group-data-[over]:-translate-y-2 group-data-[over]:rotate-0">
        <span class="absolute! inset-x-3 top-3.5 h-10 bg-[repeating-linear-gradient(180deg,rgba(23,23,15,.28)_0_2px,transparent_2px_9px)]"></span>
        <span class="absolute! right-2 bottom-1.5 text-[9px] font-bold tracking-wide text-[#8F6C08]">PDF</span>
      </span>
    </span>
    <span class="min-w-0">
      <span class="htmx-hide-on-request block font-display text-lg font-semibold text-texto sm:text-[19px]">Arraste o PDF ou o XML da nota aqui</span>
      <span class="htmx-indicator items-center gap-2 font-display text-lg font-semibold text-texto">{{ icone('loader-2', 'size-5 animate-spin text-acento') }}Lendo a nota…</span>
      <span class="mt-1.5 block text-sm text-rotulo">ou <span class="font-medium text-acento underline decoration-mostarda/40 underline-offset-[3px]">escolha um arquivo</span>. Os dados são lidos e você revisa antes de salvar.</span>
      <span class="mt-3 flex flex-wrap gap-1.5">
        {% for formato in ['DANFSe', 'Impressão do Emissor Nacional', 'XML da NFS-e'] %}
        <span class="rounded-md border border-borda bg-vidro px-2 py-0.5 text-[11px] font-semibold text-texto-2">{{ formato }}</span>
        {% endfor %}
      </span>
    </span>
    <span class="btn-primary justify-self-start sm:justify-self-auto">{{ icone('file-import') }}Importar nota</span>
  </label>
</form>
<div id="import-feedback" class="mt-4 empty:hidden"></div>

{% if certs|selectattr('ok')|list %}
<form class="mt-3 flex gap-2" hx-post="/importar/chave" hx-target="#import-feedback" hx-disabled-elt="find button">
  <label class="relative min-w-0 flex-1">
    <span class="sr-only">Chave de acesso da nota</span>
    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-apagado">{{ icone('key') }}</span>
    <input name="chave" class="input pl-9 font-mono text-xs placeholder:font-sans placeholder:text-sm" placeholder="…ou cole a chave de acesso (50 dígitos) para buscar a nota na Sefin" inputmode="numeric" required>
  </label>
  <button class="btn-ghost shrink-0">Buscar nota</button>
</form>
{% endif %}
